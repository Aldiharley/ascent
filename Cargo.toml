[package]
name = "ascent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
default-run = "ascent"
license = "Apache-2.0"

[[bin]]
name = "dashboard"
path = "src/bin/dashboard.rs"

# The test binary doubles as fake httpx/katana/nuclei (see the file), so it has
# its own `main` instead of libtest's.
[[test]]
name = "cli_scope_audit"
harness = false

# Integration test for the DAST wall-clock limit; also doubles as fake tools.
[[test]]
name = "cli_dast"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"   # maintained fork of serde_yaml
clap = { version = "4", features = ["derive"] }
ipnet = "2"
url = "2"
# Crux (the author's Apache-2.0 triage engine), linked as a library. Default
# features off: drops its `anthropic` HTTPS client, so the `ascent` CLI binary
# links no network code and triage is the offline MockTriager. The separate
# `dashboard` binary (axum/tokio below) serves loopback-only HTTP.
crux = { path = "../crux", default-features = false }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
