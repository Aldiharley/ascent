name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ascent
    steps:
      - uses: actions/checkout@v4
        with:
          path: ascent
      # Crux is a path dependency (../crux), so check it out alongside.
      - uses: actions/checkout@v4
        with:
          repository: Aldiharley/crux
          path: crux
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The XSS, image-beacon and approve-gating protections are enforced by the
  # frontend's vitest suite, so CI runs it too.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc -b, not --noEmit: the root tsconfig has `files: []` and only references.
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
