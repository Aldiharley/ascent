# Example engagement scope for Ascent.
# AUTHORISED LAB TARGETS ONLY: never list a host, network or URL you do not
# own or have explicit written permission to test. This sample targets the
# local machine only, and a lab (for example OWASP Juice Shop) must be running
# on http://127.0.0.1:3000/ for the DAST track to test anything: a declared URL
# that does not answer makes the run INCOMPLETE (exit 3 with --policy).
#
# Use 127.0.0.1, not `localhost`: ProjectDiscovery tools (httpx, katana, nuclei)
# may fail to resolve `localhost` even where curl and browsers can.
name: ascent-local-lab
hosts: []
cidrs:
  - 127.0.0.0/8
urls:
  - http://127.0.0.1:3000/
# ISO-8601 with timezone. Stored but not enforced in the MVP.
starts: "2026-01-01T00:00:00Z"
ends: "2030-01-01T00:00:00Z"
# DAST profile: passive | standard | active (default: standard). `active` adds
# parameter fuzzing; use it only on targets you may actively test. Optional
# authenticated scanning is described in samples/engagement.juiceshop.yaml.
dast:
  profile: standard
